<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — EPiKK Project Portal</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="logo">
          <img class="logo-image" src="assets/epikk.png" alt="EPiKK" />
          <div class="logo-text">EPiKK</div>
        </div>
        <div class="trace-rule" style="margin: 0 10px 16px"></div>
        <div class="nav-label">Main Menu</div>
        <a href="dashboard.html" data-nav class="nav-link active">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          Dashboard
        </a>
        <a href="projects.html" data-nav class="nav-link">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
            />
          </svg>
          Projects
        </a>
        <a
          href="users.html"
          data-nav
          class="nav-link"
          data-role-only="super_admin"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Users
        </a>
        <a
          href="dashboard.html#activity"
          data-nav
          class="nav-link"
          data-role-only="super_admin"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          Activity Log
        </a>

        <div class="sidebar-profile">
          <div class="avatar" data-profile-avatar></div>
          <div class="profile-text">
            <div class="profile-name" data-profile-name></div>
            <div class="profile-role" data-profile-role></div>
          </div>
          <a
            href="index.html"
            data-logout
            title="Log out"
            class="sidebar-logout"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </a>
        </div>
      </aside>

      <div class="main">
        <div class="topbar">
          <button class="mobile-menu-btn icon-btn" style="border: none">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <a class="topbar-logo" href="dashboard.html" data-nav
            ><img
              class="logo-image"
              src="assets/epikk.png"
              alt="EPiKK"
            /><span>EPiKK</span></a
          >
          <div class="search-wrap" style="display: none">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              class="search-input"
              placeholder="Search projects, clients, tags…"
            />
          </div>
          <div class="spacer"></div>
          <div style="position: relative">
            <button id="notif-btn" class="icon-btn">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="dot-badge"></span>
            </button>
            <div id="notif-dropdown" style="display: none"></div>
          </div>
          <div class="profile-block">
            <div class="avatar" data-profile-avatar></div>
            <div class="profile-text">
              <div class="profile-name" data-profile-name></div>
              <div class="profile-role" data-profile-role></div>
            </div>
            <a
              href="index.html"
              data-logout
              title="Log out"
              class="icon-btn"
              style="border: none; width: auto; height: auto; padding: 4px"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </a>
          </div>
        </div>

        <div class="content">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: flex-end;
              flex-wrap: wrap;
              gap: 12px;
              margin-bottom: 20px;
            "
          >
            <div>
              <h1 style="font-size: 21px">Dashboard</h1>
              <div
                style="color: var(--muted); font-size: 12.5px; margin-top: 4px"
              >
                August 5, 2026
              </div>
            </div>
            <a
              href="projects.html"
              data-nav
              class="btn btn-gold"
              data-role-only="super_admin"
              >+ New Project</a
            >
          </div>

          <!-- HERO -->
          <div
            class="hero fade-in"
            style="margin-bottom: 22px; overflow: hidden"
          >
            <button class="hero-close">
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              >
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
            <svg
              width="230"
              viewBox="0 0 300 220"
              fill="none"
              style="
                position: absolute;
                right: 12px;
                bottom: -20px;
                opacity: 0.9;
              "
            >
              <g stroke="#D9AE4E" stroke-width="1.4" opacity="0.55">
                <path d="M10 40 H110 V90 H200" />
                <path d="M30 130 H90 V180 H160" />
                <path d="M150 20 V70 H260 V150" />
              </g>
              <g fill="#D9AE4E">
                <circle cx="10" cy="40" r="4" />
                <circle cx="110" cy="90" r="4" />
                <circle cx="200" cy="90" r="4" />
                <circle cx="30" cy="130" r="4" />
                <circle cx="160" cy="180" r="4" />
                <circle cx="150" cy="20" r="4" />
                <circle cx="260" cy="150" r="4" />
              </g>
              <rect
                x="95"
                y="75"
                width="30"
                height="30"
                rx="3"
                stroke="#D9AE4E"
                stroke-width="1.4"
                opacity="0.6"
              />
            </svg>
            <div class="hero-eyebrow" id="hero-eyebrow"></div>
            <h1 id="hero-title"></h1>
            <p id="hero-sub"></p>
            </p>
            <a
              href="projects.html"
              data-nav
              class="btn btn-gold"
              style="margin-top: 18px"
              >View Projects</a
            >
          </div>

          <div
            style="
              display: grid;
              grid-template-columns: repeat(3, 1fr);
              gap: 12px;
              margin-bottom: 22px;
            "
            class="quick-stats"
          >
            <div
              class="section-label"
              style="grid-column: 1/-1; margin-bottom: -2px"
            >
              Quick Stats
            </div>
            <a
              href="projects.html?status=active"
              data-nav
              class="stat-card stat-link"
              aria-label="View active projects"
            >
              <div class="stat-icon">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
                  />
                </svg>
              </div>
              <div>
                <div class="stat-label">Active Projects</div>
                <div class="stat-value" id="stat-active">—</div>
              </div>
            </a>
            <a
              href="projects.html?status=completed"
              data-nav
              class="stat-card stat-link"
              aria-label="View completed projects"
            >
              <div class="stat-icon">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="20 6 9 17 4 12" />
                </svg>
              </div>
              <div>
                <div class="stat-label">Completed Projects</div>
                <div class="stat-value" id="stat-completed">—</div>
              </div>
            </a>
            <a
              href="#tasks"
              class="stat-card stat-link"
              aria-label="View pending tasks"
            >
              <div class="stat-icon">
                <svg
                  width="17"
                  height="17"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 3" />
                </svg>
              </div>
              <div>
                <div class="stat-label">Pending Tasks</div>
                <div class="stat-value" id="stat-pending">—</div>
              </div>
            </a>
            <div
              style="
                grid-column: 1/-1;
                font-size: 11.5px;
                color: var(--faint);
                text-align: center;
                margin-top: -2px;
              "
              id="last-update-note"
            ></div>
          </div>

          <div class="dash-layout" style="display: block">
            <style>
              @media (max-width: 1050px) {
                .dash-layout {
                  grid-template-columns: 1fr !important;
                }
              }
            </style>

            <div
              style="display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px"
              class="dash-cols"
            >
              <style>
                @media (max-width: 760px) {
                  .dash-cols {
                    grid-template-columns: 1fr !important;
                  }
                }
              </style>

              <div style="display: flex; flex-direction: column; gap: 16px">
                <div class="card card-pad trace-card" id="tasks">
                  <div class="section-label">Timeline</div>
                  <div id="timeline-groups"></div>
                </div>
                <div class="card card-pad" id="activity">
                  <div class="section-label">Recent Activities</div>
                  <div id="activity-list"></div>
                </div>
              </div>

              <div style="display: flex; flex-direction: column; gap: 16px">
                <div class="card card-pad trace-card">
                  <div class="section-label">Tasks</div>
                  <div id="task-groups"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const ok = await loadAppData();
        if (!ok) return; // loadAppData() already redirected to index.html
        const user = initChrome();
        const projects = visibleProjects(user);
        const heroName = (user.username || user.fullName || "User").split(" ")[0];

        document.getElementById("hero-title").textContent =
          `Welcome back, ${heroName}`;
        document.getElementById("hero-eyebrow").textContent =
          roleLabel(user.role) + " · Project Portal";
        document.getElementById("hero-sub").textContent = projects.length
          ? `You have ${projects.filter((p) => p.status !== "Completed" && p.status !== "Archived").length} active project${projects.length !== 1 ? "s" : ""} moving right now.`
          : "No projects assigned yet.";

        // ---- stats ----
        document.getElementById("stat-active").textContent = projects.filter(
          (p) => p.status !== "Completed" && p.status !== "Archived",
        ).length;
        document.getElementById("stat-completed").textContent = projects.filter(
          (p) => p.status === "Completed",
        ).length;
        document.getElementById("stat-pending").textContent = projects.reduce(
          (n, p) => n + p.tasks.filter((t) => !t.done).length,
          0,
        );

        // ---- timeline, grouped by project ----
        const timelineGroups = projects
          .map((p) => {
            const events = p.timeline
              .filter(
                (t) => user.role !== "client" || t.visibility === "client",
              )
              .slice()
              .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
              .slice(0, 3);
            return { p, events };
          })
          .filter((g) => g.events.length);
        const tlEl = document.getElementById("timeline-groups");
        tlEl.innerHTML = timelineGroups.length
          ? timelineGroups
              .map(
                (g) => `
      <div style="margin-bottom:14px;">
        <a href="project.html?id=${g.p.id}" data-nav style="font-size:12.5px;font-weight:700;color:var(--gold-deep);">${escapeHtml(g.p.title)}</a>
        ${g.events
          .map(
            (t) => `
          <div class="row-item">
            <div style="width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;"></div>
            <div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">${escapeHtml(t.title)}</div><div style="font-size:11px;color:var(--muted);">${timeAgo(t.createdAt)}</div></div>
          </div>`,
          )
          .join("")}
      </div>`,
              )
              .join("")
          : `<div style="color:var(--muted);font-size:12.5px;padding:8px 0;">No updates yet.</div>`;
        document
          .querySelectorAll("#timeline-groups a")
          .forEach((a) =>
            a.setAttribute("href", withRole(a.getAttribute("href"))),
          );

        // ---- tasks, grouped by project ----
        const taskGroups = projects
          .map((p) => {
            const pending = p.tasks.filter((t) => !t.done);
            return { p, pending: pending.slice(0, 4), total: pending.length };
          })
          .filter((g) => g.pending.length);
        document.getElementById("task-groups").innerHTML = taskGroups.length
          ? taskGroups
              .map(
                (g) => `
      <div style="margin-bottom:14px;">
        <a href="project.html?id=${g.p.id}" data-nav style="font-size:12.5px;font-weight:700;color:var(--gold-deep);">${escapeHtml(g.p.title)}</a>
        ${g.pending
          .map(
            (t) => `
          <label class="row-item" style="cursor:${user.role === "client" ? "default" : "pointer"};">
            <input type="checkbox" ${user.role === "client" ? "disabled" : ""} data-task-toggle data-title="${escapeHtml(t.title)}">
            <span style="font-size:13px;flex:1;">${escapeHtml(t.title)}</span>
          </label>`,
          )
          .join("")}
        ${g.total > 4 ? `<div style="font-size:11px;color:var(--faint);padding:4px 0 0 2px;">+${g.total - 4} more</div>` : ""}
      </div>`,
              )
              .join("")
          : `<div style="color:var(--muted);font-size:12.5px;padding:8px 0;">No pending tasks.</div>`;
        document
          .querySelectorAll("#task-groups a")
          .forEach((a) =>
            a.setAttribute("href", withRole(a.getAttribute("href"))),
          );
        document
          .querySelectorAll("[data-task-toggle]")
          .forEach((cb) =>
            cb.addEventListener("change", () =>
              toast(
                `${cb.checked ? "Completed" : "Reopened"}: ${cb.dataset.title} (preview only, not saved)`,
              ),
            ),
          );

        // ---- recent activities ----
        let activities = ACTIVITY;
        if (user.role === "client")
          activities = activities.filter(
            (a) =>
              a.projectId &&
              projects.some(
                (p) => p.id === a.projectId && p.clientId === user.id,
              ),
          );
        else if (user.role !== "super_admin")
          activities = activities.filter(
            (a) => a.projectId && projects.some((p) => p.id === a.projectId),
          );
        else
          activities = activities.filter(
            (a) => !a.projectId || projects.some((p) => p.id === a.projectId),
          );
        document.getElementById("activity-list").innerHTML = activities.slice(
          0,
          6,
        ).length
          ? activities
              .slice(0, 6)
              .map((a) => {
                const au = userById(a.userId);
                const pr = a.projectId ? projById(a.projectId) : null;
                return `<div class="row-item">
        <div class="avatar avatar-sm">${initials(au ? au.fullName : "?")}</div>
        <div style="flex:1;font-size:13px;"><b>${escapeHtml(au ? au.fullName.split(" ")[0] : "Someone")}</b> ${escapeHtml(a.action)}${pr ? ` <a href="project.html?id=${pr.id}" data-nav style="color:var(--gold-deep);font-weight:600;">${escapeHtml(pr.title)}</a>` : ""}
          <div style="font-size:11px;color:var(--muted);">${timeAgo(a.timestamp)}</div></div>
      </div>`;
              })
              .join("")
          : `<div style="color:var(--muted);font-size:12.5px;padding:8px 0;">No activity yet.</div>`;
        document
          .querySelectorAll("#activity-list a")
          .forEach((a) =>
            a.setAttribute("href", withRole(a.getAttribute("href"))),
          );

        document.getElementById("last-update-note").textContent =
          "Last update " + fmtDate(new Date().toISOString());
        document.getElementById("hero-close") &&
          document
            .querySelector(".hero-close")
            .addEventListener("click", (e) => {
              e.target.closest(".hero").style.display = "none";
            });
      });
    </script>
  </body>
</html>
