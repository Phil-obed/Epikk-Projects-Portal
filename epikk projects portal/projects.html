<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects — EPiKK Project Portal</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="logo">
          <img class="logo-image" src="../assets/epikk.png" alt="EPiKK" />
          <div class="logo-text">EPiKK</div>
        </div>
        <div class="trace-rule" style="margin: 0 10px 16px"></div>
        <div class="nav-label">Main Menu</div>
        <a href="dashboard.html" data-nav class="nav-link">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          Dashboard
        </a>
        <a href="projects.html" data-nav class="nav-link active">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
            />
          </svg>
          Projects
        </a>
        <a
          href="users.html"
          data-nav
          class="nav-link"
          data-role-only="super_admin"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Users
        </a>
        <a
          href="dashboard.html#activity"
          data-nav
          class="nav-link"
          data-role-only="super_admin"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          Activity Log
        </a>
        <div class="sidebar-profile">
          <div class="avatar" data-profile-avatar></div>
          <div class="profile-text">
            <div class="profile-name" data-profile-name></div>
            <div class="profile-role" data-profile-role></div>
          </div>
          <a
            href="index.html"
            data-logout
            title="Log out"
            class="sidebar-logout"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </a>
        </div>
      </aside>

      <div class="main">
        <div class="topbar">
          <button class="mobile-menu-btn icon-btn" style="border: none">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <a class="topbar-logo" href="dashboard.html" data-nav
            ><img
              class="logo-image"
              src="../assets/epikk.png"
              alt="EPiKK"
            /><span>EPiKK</span></a
          >
          <div class="search-wrap" style="display: none">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              class="search-input"
              id="search-input"
              placeholder="Search projects, clients, tags…"
            />
          </div>
          <div class="spacer"></div>
          <button id="notif-btn" class="icon-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="dot-badge"></span>
          </button>
          <div id="notif-dropdown" style="display: none"></div>
          <div class="profile-block">
            <div class="avatar" data-profile-avatar></div>
            <div class="profile-text">
              <div class="profile-name" data-profile-name></div>
              <div class="profile-role" data-profile-role></div>
            </div>
            <a
              href="index.html"
              data-logout
              title="Log out"
              class="icon-btn"
              style="border: none; width: auto; height: auto; padding: 4px"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </a>
          </div>
        </div>

        <div class="content">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 20px;
              flex-wrap: wrap;
              gap: 10px;
            "
          >
            <h1 style="font-size: 20px">Projects</h1>
            <button
              id="open-create-project"
              class="btn btn-gold"
              data-role-only="super_admin"
            >
              + New Project
            </button>
          </div>
          <div
            id="project-grid"
            style="
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
              gap: 16px;
            "
          ></div>
          <div id="completed-section" style="display: none; margin-top: 30px">
            <div class="section-label">Completed Projects</div>
            <div
              id="completed-grid"
              style="
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
                gap: 16px;
              "
            ></div>
          </div>
          <div
            id="empty-state"
            class="card card-pad"
            style="
              display: none;
              text-align: center;
              color: var(--muted);
              padding: 44px;
            "
          >
            No projects assigned yet.
          </div>
        </div>
      </div>
    </div>

    <!-- Create Project modal (frontend-only — nothing is saved) -->
    <div
      id="create-project-overlay"
      class="modal-overlay"
      style="display: none"
    >
      <div class="modal fade-in">
        <div class="modal-header">
          <h2 style="font-size: 15.5px">Create Project</h2>
          <button
            id="close-create-project"
            class="icon-btn"
            style="border: none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            >
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
        <form id="create-project-form" class="modal-body">
          <div>
            <label class="field-label">Project Name</label
            ><input class="input" name="title" required />
          </div>
          <div>
            <label class="field-label">Project Description</label
            ><textarea class="input" name="description" required></textarea>
          </div>
          <div>
            <label class="field-label">Project Category</label>
            <select class="input" name="category">
              <option>EPiKK Skills Lab — Student Aid</option>
              <option>EPiKK Engineering — Freelancing Project</option>
            </select>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
            <div>
              <label class="field-label">Client</label
              ><select class="input" name="clientId"></select>
            </div>
            <div>
              <label class="field-label">Assigned Engineer</label
              ><select class="input" name="engineerId"></select>
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
            <div>
              <label class="field-label">Due Date</label
              ><input class="input" type="date" name="dueDate" required />
            </div>
            <div>
              <label class="field-label"
                >Priority
                <span
                  style="
                    text-transform: none;
                    font-weight: 400;
                    color: var(--faint);
                  "
                  >(hidden from client)</span
                ></label
              ><select class="input" name="priority">
                <option>Low</option>
                <option selected>Medium</option>
                <option>High</option>
              </select>
            </div>
          </div>
          <div>
            <label class="field-label">Project Budget (GHS)</label
            ><input
              class="input"
              type="number"
              name="budget"
              min="0"
              step="0.01"
              placeholder="0.00"
              required
            />
          </div>
          <div>
            <label class="field-label">Tags</label>
            <div
              id="tag-checks"
              style="display: flex; gap: 6px; flex-wrap: wrap"
            ></div>
          </div>
          <div>
            <label class="field-label"
              >Tasks
              <span
                style="
                  text-transform: none;
                  font-weight: 400;
                  color: var(--faint);
                "
                >(one per line — every 5 become a milestone)</span
              ></label
            >
            <textarea
              class="input mono"
              name="tasks"
              rows="7"
              placeholder="Define requirements&#10;Research components&#10;Draft CAD design&#10;..."
              style="
                font-family: &quot;JetBrains Mono&quot;, monospace;
                font-size: 12.5px;
              "
            ></textarea>
          </div>
          <button
            type="submit"
            class="btn btn-gold"
            style="padding: 12px; margin-top: 4px"
          >
            Create Project
          </button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const ok = await loadAppData();
        if (!ok) return; // loadAppData() already redirected to index.html
        const user = initChrome();
        const allProjects = visibleProjects(user);
        const statusFilter = new URLSearchParams(location.search).get("status");
        const projects =
          statusFilter === "completed"
            ? allProjects.filter((p) => p.status === "Completed")
            : statusFilter === "active"
              ? allProjects.filter(
                  (p) => p.status !== "Completed" && p.status !== "Archived",
                )
              : allProjects;

        function statusBadge(s) {
          const map = {
            Completed: "badge-green",
            Archived: "badge-gray",
            "Waiting for Client": "badge-red",
          };
          return `<span class="badge ${map[s] || "badge-gold"}">${escapeHtml(s)}</span>`;
        }
        function priorityBadge(p) {
          const map = {
            High: "badge-red",
            Medium: "badge-gold",
            Low: "badge-gray",
          };
          return `<span class="badge ${map[p] || "badge-gray"}">${escapeHtml(p)}</span>`;
        }
        function projectCard(p) {
          const client = userById(p.clientId),
            eng = userById(p.engineerId);
          const showPriority = user.role !== "client";
          const isCompleted = p.status === "Completed";
          return `<a href="project.html?id=${p.id}" data-nav class="card card-hover card-pad trace-card fade-in${isCompleted ? " project-card-completed" : ""}" style="display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <h3 style="font-size:14.5px;line-height:1.35;">${escapeHtml(p.title)}</h3>
          ${showPriority ? priorityBadge(p.priority) : ""}
        </div>
        <div style="font-size:11.5px;color:var(--muted);">${escapeHtml(p.category)} · ${escapeHtml(p.subtype)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">${p.tags
          .slice(0, 3)
          .map((t) => `<span class="badge badge-gray">${escapeHtml(t)}</span>`)
          .join("")}</div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;"><span>Progress</span><span>${p.progress}%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width:${p.progress}%;"></div></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">${statusBadge(p.status)}<span style="font-size:11px;color:var(--muted);">Due ${fmtDate(p.dueDate)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line-soft);padding-top:9px;">
          <span>Client: ${escapeHtml(client ? client.fullName : "—")}</span><span>Eng: ${escapeHtml(eng ? eng.fullName.split(" ")[0] : "Unassigned")}</span>
        </div>
        ${!isCompleted && user.role !== "client" ? `<button type="button" class="btn btn-outline btn-sm complete-project-btn" data-project-id="${p.id}">Mark as completed</button>` : ""}
      </a>`;
        }

        const grid = document.getElementById("project-grid");
        const completedGrid = document.getElementById("completed-grid");
        const completedSection = document.getElementById("completed-section");
        const emptyState = document.getElementById("empty-state");

        function wireProjectLinks() {
          document
            .querySelectorAll("#project-grid a, #completed-grid a")
            .forEach((a) =>
              a.setAttribute("href", withRole(a.getAttribute("href"))),
            );
          document.querySelectorAll(".complete-project-btn").forEach((button) =>
            button.addEventListener("click", (e) => {
              e.preventDefault();
              e.stopPropagation();
              const project = projects.find(
                (p) => p.id === button.dataset.projectId,
              );
              if (!project) return;
              project.status = "Completed";
              project.progress = 100;
              renderProjects(document.getElementById("search-input").value);
              toast(`${project.title} marked as completed.`);
            }),
          );
        }

        function renderProjects(query = "") {
          const normalizedQuery = query.trim().toLowerCase();
          const filtered = projects.filter(
            (p) =>
              !normalizedQuery ||
              p.title.toLowerCase().includes(normalizedQuery) ||
              p.tags.some((t) => t.toLowerCase().includes(normalizedQuery)),
          );
          const active = filtered.filter(
            (p) => p.status !== "Completed" && p.status !== "Archived",
          );
          const completed = filtered.filter((p) => p.status === "Completed");
          grid.innerHTML = active.map(projectCard).join("");
          completedGrid.innerHTML = completed.map(projectCard).join("");
          completedSection.style.display = completed.length ? "block" : "none";
          emptyState.style.display =
            active.length || completed.length ? "none" : "block";
          wireProjectLinks();
        }

        renderProjects();

        // live search
        document
          .getElementById("search-input")
          .addEventListener("input", (e) => {
            renderProjects(e.target.value);
          });

        // ---- create project modal (visual only — see DEPLOY notes) ----
        const overlay = document.getElementById("create-project-overlay");
        document.getElementById("tag-checks").innerHTML = TAGS.map(
          (t) =>
            `<label style="display:flex;align-items:center;gap:5px;font-size:11.5px;background:var(--paper);border:1px solid var(--line);padding:5px 10px;border-radius:20px;"><input type="checkbox" value="${t}" style="margin:0;">${t}</label>`,
        ).join("");
        document.querySelector('select[name="clientId"]').innerHTML =
          USERS.filter((u) => u.role === "client")
            .map(
              (u) =>
                `<option value="${u.id}">${escapeHtml(u.fullName)}</option>`,
            )
            .join("");
        document.querySelector('select[name="engineerId"]').innerHTML =
          `<option value="">Unassigned</option>` +
          USERS.filter((u) => u.role === "engineer")
            .map(
              (u) =>
                `<option value="${u.id}">${escapeHtml(u.fullName)}</option>`,
            )
            .join("");

        const openBtn = document.getElementById("open-create-project");
        if (openBtn)
          openBtn.addEventListener(
            "click",
            () => (overlay.style.display = "flex"),
          );
        document
          .getElementById("close-create-project")
          .addEventListener("click", () => (overlay.style.display = "none"));
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.style.display = "none";
        });
        document
          .getElementById("create-project-form")
          .addEventListener("submit", (e) => {
            e.preventDefault();
            overlay.style.display = "none";
            toast(
              "This is a frontend preview — hook up a backend to actually save new projects.",
            );
          });
      });
    </script>
  </body>
</html>
