<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project — EPiKK Project Portal</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <div class="shell">
      <div class="sidebar-overlay"></div>
      <aside class="sidebar">
        <div class="logo">
          <img class="logo-image" src="../assets/epikk.png" alt="EPiKK" />
          <div class="logo-text">EPiKK</div>
        </div>
        <div class="trace-rule" style="margin: 0 10px 16px"></div>
        <div class="nav-label">Main Menu</div>
        <a href="dashboard.html" data-nav class="nav-link">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          Dashboard
        </a>
        <a href="projects.html" data-nav class="nav-link active">
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"
            />
          </svg>
          Projects
        </a>
        <a
          href="users.html"
          data-nav
          class="nav-link"
          data-role-only="super_admin"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Users
        </a>
        <a
          href="dashboard.html#activity"
          data-nav
          class="nav-link"
          data-role-only="super_admin"
        >
          <svg
            width="17"
            height="17"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
          Activity Log
        </a>
        <div class="sidebar-profile">
          <div class="avatar" data-profile-avatar></div>
          <div class="profile-text">
            <div class="profile-name" data-profile-name></div>
            <div class="profile-role" data-profile-role></div>
          </div>
          <a
            href="index.html"
            data-logout
            title="Log out"
            class="sidebar-logout"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </a>
        </div>
      </aside>

      <div class="main">
        <div class="topbar">
          <button class="mobile-menu-btn icon-btn" style="border: none">
            <svg
              width="19"
              height="19"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M4 7h16M4 12h16M4 17h16" />
            </svg>
          </button>
          <a class="topbar-logo" href="dashboard.html" data-nav
            ><img
              class="logo-image"
              src="../assets/epikk.png"
              alt="EPiKK"
            /><span>EPiKK</span></a
          >
          <div class="search-wrap" style="display: none">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input
              class="search-input"
              placeholder="Search projects, clients, tags…"
            />
          </div>
          <div class="spacer"></div>
          <button id="notif-btn" class="icon-btn">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
            <span class="dot-badge"></span>
          </button>
          <div id="notif-dropdown" style="display: none"></div>
          <div class="profile-block">
            <div class="avatar" data-profile-avatar></div>
            <div class="profile-text">
              <div class="profile-name" data-profile-name></div>
              <div class="profile-role" data-profile-role></div>
            </div>
            <a
              href="index.html"
              data-logout
              title="Log out"
              class="icon-btn"
              style="border: none; width: auto; height: auto; padding: 4px"
            >
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </a>
          </div>
        </div>

        <div class="content" id="content-root">
          <div style="color: var(--muted); font-size: 13px">Loading…</div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-client.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/app.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
      integrity="sha512-5nuG9C/11VxPjzvQ4kbI4kfnW6RlzW8Z3fQJf6zPqBk3JG/HsPZ4Dh9n5Y+EVXj+L66kBosLuqbI4XzDmjY+VQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      function statusBadge(s) {
        const map = {
          Completed: "badge-green",
          Archived: "badge-gray",
          "Waiting for Client": "badge-red",
        };
        return `<span class="badge ${map[s] || "badge-gold"}">${escapeHtml(s)}</span>`;
      }
      function priorityBadge(p) {
        const map = {
          High: "badge-red",
          Medium: "badge-gold",
          Low: "badge-gray",
        };
        return `<span class="badge ${map[p] || "badge-gray"}">${escapeHtml(p)}</span>`;
      }
      function fileChip(type) {
        return `<div class="chip-icon mono">${escapeHtml((type || "FILE").slice(0, 4))}</div>`;
      }

      function overviewPanel(p, user, canEdit, client, eng) {
        const total = p.tasks.length,
          done = p.tasks.filter((t) => t.done).length;
        const showPriority = user.role !== "client";
        return `<div style="display:grid;grid-template-columns:2fr 1fr;gap:16px;" class="ov-grid">
    <style>@media(max-width:820px){.ov-grid{grid-template-columns:1fr !important;}}</style>
      <div class="card card-pad trace-card">
        <div class="section-label">Description</div>
        <p style="font-size:14px;line-height:1.65;margin:0 0 18px;">${escapeHtml(p.description)}</p>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;"><span>Progress · ${done}/${total} tasks</span><span>${p.progress}%</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${p.progress}%;"></div></div>
        <div style="margin-top:18px;display:flex;gap:6px;flex-wrap:wrap;">${p.tags.map((t) => `<span class="badge badge-gray">${escapeHtml(t)}</span>`).join("")}</div>
        <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;">
          <button id="open-workspace" class="btn btn-primary">Open Project →</button>
          ${canEdit ? `<button id="open-progress-update" class="btn btn-outline">+ Upload Progress Update</button>` : ""}
        </div>
      </div>
      <div class="card card-pad" style="display:flex;flex-direction:column;gap:12px;font-size:13px;">
        ${ovRow("Status", statusBadge(p.status))}
        ${showPriority ? ovRow("Priority", priorityBadge(p.priority)) : ""}
        ${ovRow("Budget", fmtMoney(p.budget))}
        ${ovRow("Client", escapeHtml(client ? client.fullName : "—"))}
        ${ovRow("Engineer", escapeHtml(eng ? eng.fullName : "Unassigned"))}
        ${ovRow("Due Date", fmtDate(p.dueDate))}
        ${ovRow("Category", escapeHtml(p.category) + " · " + escapeHtml(p.subtype))}
        ${ovRow("Last Updated", timeAgo(p.lastUpdated))}
      </div>
    </div>`;
      }
      function ovRow(label, val) {
        return `<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-soft);padding-top:10px;"><span style="color:var(--muted);">${label}</span><span style="font-weight:600;text-align:right;">${val}</span></div>`;
      }

      function workspacePanel(p, canEdit) {
        const events = p.timeline
          .slice()
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <button id="close-workspace" class="btn btn-outline btn-sm">← Overview</button>
      ${canEdit ? `<button id="open-progress-update-2" class="btn btn-gold btn-sm">+ Upload Progress Update</button>` : ""}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;" class="wk-grid">
    <style>@media(max-width:900px){.wk-grid{grid-template-columns:1fr !important;}}</style>
      <div class="card card-pad trace-card scrollbar" style="max-height:640px;overflow-y:auto;">
        <div class="section-label">Timeline</div>
        ${
          events.length === 0
            ? `<div style="color:var(--muted);font-size:12.5px;">No timeline events yet.</div>`
            : events
                .map((t) => {
                  const cu = userById(t.createdBy);
                  return `<div class="row-item" style="align-items:flex-start;">
            <div style="width:7px;height:7px;border-radius:50%;background:var(--gold);margin-top:6px;flex-shrink:0;"></div>
            <div style="flex:1;">
              <div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;"><h4 style="font-size:13.5px;font-weight:700;">${escapeHtml(t.title)}</h4>${t.visibility === "internal" ? '<span class="badge badge-ink">Internal</span>' : ""}</div>
              <p style="font-size:12.5px;color:var(--muted);margin:4px 0;line-height:1.55;">${escapeHtml(t.description)}</p>
              <div style="font-size:10.5px;color:var(--faint);">${escapeHtml(cu ? cu.fullName : "System")} · ${fmtDateTime(t.createdAt)}</div>
            </div></div>`;
                })
                .join("")
        }
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="card card-pad">
          <div class="section-label">Milestones</div>
          ${p.milestones
            .map((ms) => {
              const tasks = p.tasks.filter((t) => t.milestoneId === ms.id);
              return `<div style="border-top:1px solid var(--line-soft);padding:12px 0;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
                <span style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;">${ms.completed ? '<span style="color:var(--success);">✓</span>' : ""}${escapeHtml(ms.title)}</span>
                <span style="font-size:10.5px;color:var(--muted);">${ms.targetDate ? fmtDate(ms.targetDate) : ""}</span>
              </div>
              ${tasks
                .map(
                  (
                    t,
                  ) => `<label style="display:flex;align-items:center;gap:8px;padding:4px 0 4px 6px;font-size:12.5px;cursor:${canEdit ? "pointer" : "default"};">
                <input type="checkbox" ${t.done ? "checked" : ""} ${canEdit ? "" : "disabled"} data-task-toggle data-tid="${t.id}">
                <span style="${t.done ? "color:var(--muted);text-decoration:line-through;" : ""}">${escapeHtml(t.title)}</span>
              </label>`,
                )
                .join("")}
            </div>`;
            })
            .join("")}
        </div>
        <div class="card card-pad">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div class="section-label">Files</div>
            ${p.files.length ? '<button id="download-all-files" class="btn btn-primary btn-sm">Download All</button>' : ""}
          </div>
          ${
            p.files.length === 0
              ? `<div style="color:var(--muted);font-size:12.5px;">No files uploaded yet.</div>`
              : p.files
                  .map((f) => {
                    const fu = userById(f.uploaderId);
                    return `<div class="row-item">
              ${fileChip(f.type)}
              <div style="flex:1;min-width:0;"><div style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(f.filename)}</div><div style="font-size:10.5px;color:var(--muted);">${escapeHtml(fu ? fu.fullName : "Unknown")} · ${fmtDate(f.uploadedAt)} · ${f.size}</div></div>
              <button class="icon-btn" data-download="${escapeHtml(f.filename)}">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              </button>
            </div>`;
                  })
                  .join("")
          }
        </div>
      </div>
    </div>`;
      }

      function chatBubble(m, currentUser) {
        const isSystem = m.userId === "system";
        const mu = isSystem
          ? { fullName: "EPiKK System", role: "system" }
          : userById(m.userId);
        const mine = m.userId === currentUser.id;
        return `<div style="margin-bottom:13px;display:flex;flex-direction:column;align-items:${mine ? "flex-end" : "flex-start"};">
      <div style="font-size:10px;color:var(--faint);margin-bottom:3px;">${escapeHtml(mu.fullName)}${isSystem ? "" : " · " + roleLabel(mu.role)} · ${timeAgo(m.createdAt)}</div>
      <div style="max-width:82%;padding:9px 12px;border-radius:12px;font-size:12.5px;line-height:1.45;
        background:${isSystem ? "var(--gold-wash)" : mine ? "var(--ink)" : "#fff"};
        color:${isSystem ? "var(--gold-deep)" : mine ? "#fff" : "var(--text)"};
        border:${mine ? "none" : "1px solid " + (isSystem ? "#EBD9AE" : "var(--line)")};">
        ${escapeHtml(m.message)}
      </div>
    </div>`;
      }

      function zipFileName(project) {
        const slug = project.title
          .replace(/[^a-zA-Z0-9]+/g, "_")
          .replace(/_+/g, "_")
          .replace(/^_|_$/g, "");
        const now = new Date();
        const pad = (n) => n.toString().padStart(2, "0");
        return `${slug}_${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}.zip`;
      }

      function downloadProjectFiles(project) {
        if (!window.JSZip) {
          toast("Unable to create ZIP: JSZip not loaded.");
          return;
        }
        if (!project.files.length) {
          toast("No files available to download.");
          return;
        }
        const zip = new JSZip();
        project.files.forEach((f) => {
          const uploader = userById(f.uploaderId);
          zip.file(
            f.filename,
            `Project: ${project.title}\nUploaded by: ${uploader ? uploader.fullName : "Unknown"}\nDate: ${fmtDate(f.uploadedAt)}\nSize: ${f.size}\n\nThis is a preview bundle file for ${f.filename}. Actual file contents are not included in this mock app.`,
          );
        });
        zip.generateAsync({ type: "blob" }).then((blob) => {
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = zipFileName(project);
          document.body.appendChild(anchor);
          anchor.click();
          anchor.remove();
          URL.revokeObjectURL(url);
          toast("Downloading project files as ZIP.");
        });
      }

      document.addEventListener("DOMContentLoaded", async () => {
        const ok = await loadAppData();
        if (!ok) return; // loadAppData() already redirected to index.html
        const user = initChrome();
        const params = new URLSearchParams(location.search);
        const p = projById(params.get("id")) || visibleProjects(user)[0];
        const root = document.getElementById("content-root");

        if (!p) {
          root.innerHTML = `<div class="card card-pad" style="text-align:center;color:var(--muted);">No project to show.</div>`;
          return;
        }

        const canEdit =
          user.role === "super_admin" ||
          (user.role === "engineer" && p.engineerId === user.id);
        const client = userById(p.clientId),
          eng = userById(p.engineerId);
        let expanded = false;

        function renderMain() {
          const showPriority = user.role !== "client";
          root.innerHTML = `
        <a href="projects.html" data-nav style="font-size:12.5px;color:var(--muted);">← Back to Projects</a>
        <div style="margin:10px 0 6px;"><h1 style="font-size:20px;">${escapeHtml(p.title)}</h1></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;">${statusBadge(p.status)}${showPriority ? priorityBadge(p.priority) : ""}<span class="badge badge-gray">${escapeHtml(p.category)}</span></div>
        <div id="panel-slot"></div>`;
          document
            .querySelectorAll("#content-root a[data-nav]")
            .forEach((a) =>
              a.setAttribute("href", withRole(a.getAttribute("href"))),
            );
          renderPanel();
        }

        function renderPanel() {
          const slot = document.getElementById("panel-slot");
          slot.innerHTML = expanded
            ? workspacePanel(p, canEdit)
            : overviewPanel(p, user, canEdit, client, eng);
          const openBtn = document.getElementById("open-workspace");
          if (openBtn)
            openBtn.addEventListener("click", () => {
              expanded = true;
              renderPanel();
            });
          const closeBtn = document.getElementById("close-workspace");
          if (closeBtn)
            closeBtn.addEventListener("click", () => {
              expanded = false;
              renderPanel();
            });
          ["open-progress-update", "open-progress-update-2"].forEach((id) => {
            const btn = document.getElementById(id);
            if (btn)
              btn.addEventListener(
                "click",
                () =>
                  (document.getElementById("progress-overlay").style.display =
                    "flex"),
              );
          });
          slot.querySelectorAll("[data-task-toggle]").forEach((cb) =>
            cb.addEventListener("change", () => {
              const t = p.tasks.find((x) => x.id === cb.dataset.tid);
              t.done = cb.checked;
              const ms = p.milestones.find((m) => m.id === t.milestoneId);
              const allDone = p.tasks
                .filter((x) => x.milestoneId === ms.id)
                .every((x) => x.done);
              if (allDone && !ms.completed) {
                ms.completed = true;
                toast(
                  `Milestone "${ms.title}" complete — a message would post to the client thread.`,
                );
              }
              p.progress = Math.round(
                (p.tasks.filter((x) => x.done).length / p.tasks.length) * 100,
              );
              renderPanel();
            }),
          );
          slot
            .querySelectorAll("[data-download]")
            .forEach((b) =>
              b.addEventListener("click", () =>
                toast(
                  `Preview only — connect file storage to download ${b.dataset.download}`,
                ),
              ),
            );
          const downloadAllBtn = document.getElementById("download-all-files");
          if (downloadAllBtn) {
            downloadAllBtn.addEventListener("click", () =>
              downloadProjectFiles(p),
            );
          }
        }

        renderMain();

        // ---- floating discussion (messaging-app style) ----
        const chatWrap = document.createElement("div");
        chatWrap.innerHTML = `
      <div class="chat-panel" id="chat-panel" style="display:none;">
        <div style="padding:13px 16px;background:var(--ink);color:#fff;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;">
          <div><div style="font-size:12.5px;font-weight:700;">${escapeHtml(p.title)}</div><div style="font-size:10px;color:rgba(255,255,255,0.45);">Discussion</div></div>
          <button id="chat-close" style="background:none;border:none;color:rgba(255,255,255,0.7);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="scrollbar" id="chat-messages" style="flex:1;overflow-y:auto;padding:15px;background:var(--paper);"></div>
        <form id="chat-form" style="display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;">
          <input class="input" name="message" placeholder="Message…" autocomplete="off" required style="font-size:13px;">
          <button class="btn btn-gold btn-sm" type="submit">Send</button>
        </form>
      </div>`;
        document.body.appendChild(chatWrap);

        function renderChatMessages() {
          const el = document.getElementById("chat-messages");
          el.innerHTML = p.discussion.length
            ? p.discussion.map((m) => chatBubble(m, user)).join("")
            : `<div style="color:var(--muted);font-size:12.5px;text-align:center;padding:24px 0;">No messages yet.</div>`;
          el.scrollTop = el.scrollHeight;
        }
        renderChatMessages();

        const chatPanel = document.getElementById("chat-panel");
        document
          .getElementById("chat-close")
          .addEventListener("click", () => (chatPanel.style.display = "none"));
        document.getElementById("chat-form").addEventListener("submit", (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          p.discussion.push({
            id: "d" + Date.now(),
            userId: user.id,
            message: fd.get("message"),
            createdAt: new Date().toISOString(),
          });
          e.target.reset();
          renderChatMessages();
        });

        if (params.get("open") === "chat") chatPanel.style.display = "flex";

        // ---- progress update modal (visual only) ----
        const modalWrap = document.createElement("div");
        modalWrap.innerHTML = `
      <div id="progress-overlay" class="modal-overlay" style="display:none;">
        <div class="modal fade-in">
          <div class="modal-header"><h2 style="font-size:15.5px;">Upload Progress Update</h2>
            <button id="close-progress" class="icon-btn" style="border:none;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
          </div>
          <form id="progress-form" class="modal-body">
            <div><label class="field-label">Title</label><input class="input" name="title" required></div>
            <div><label class="field-label">Description</label><textarea class="input" name="description" required></textarea></div>
            <div><label class="field-label">Visibility</label><select class="input" name="visibility"><option value="client">Client Visible</option><option value="internal">Internal Only</option></select></div>
            <div><label class="field-label">Attachments (optional)</label><input class="input" type="file" name="attachments" multiple></div>
            <button type="submit" class="btn btn-gold" style="padding:12px;">Publish Update</button>
          </form>
        </div>
      </div>`;
        document.body.appendChild(modalWrap);
        const progressOverlay = document.getElementById("progress-overlay");
        document
          .getElementById("close-progress")
          .addEventListener(
            "click",
            () => (progressOverlay.style.display = "none"),
          );
        progressOverlay.addEventListener("click", (e) => {
          if (e.target === progressOverlay)
            progressOverlay.style.display = "none";
        });
        document
          .getElementById("progress-form")
          .addEventListener("submit", (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            p.timeline.unshift({
              id: "tl" + Date.now(),
              title: fd.get("title"),
              description: fd.get("description"),
              visibility: fd.get("visibility"),
              createdBy: user.id,
              createdAt: new Date().toISOString(),
            });
            progressOverlay.style.display = "none";
            toast("Progress update published (preview only, not saved).");
            renderPanel();
          });
      });
    </script>
  </body>
</html>
